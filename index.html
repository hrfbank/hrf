<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="حروف: بنك أسئلة ثقافية عربية مدققة، مرتبة حسب المجال والحرف." />
    <meta name="theme-color" content="#F4EEE2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111719" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&family=Reem+Kufi:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>حروف | بنك الأسئلة</title>
    <script>
      try {
        var t = localStorage.getItem("hrf-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
